<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostica E-Wallet (sola lettura)</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;background:#0a1410;color:#f4efe4;padding:20px;line-height:1.5}
  h1{color:#4ade80;font-size:1.3em}
  .warn{background:rgba(255,155,143,.15);border:1px solid rgba(255,155,143,.4);padding:12px 16px;border-radius:10px;margin-bottom:20px}
  .key{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:14px 16px;border-radius:10px;margin-bottom:10px}
  .key b{color:#ffb84a}
  .meta{color:#9fb3ab;font-size:.85em;margin-top:4px}
  pre{white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.3);padding:10px;border-radius:8px;font-size:.8em;max-height:200px;overflow:auto}
  button{background:#4ade80;color:#052e16;border:none;padding:10px 16px;border-radius:8px;font-weight:bold;margin-bottom:16px}
</style>
</head>
<body>
<h1>🔍 Diagnostica locale — SOLA LETTURA</h1>
<div class="warn">Questa pagina NON modifica, NON cancella, NON invia nulla al cloud. Legge solo cosa c'è già salvato sul dispositivo, in questo momento.</div>
<button onclick="scan()">Rileggi ora</button>
<div id="out"></div>
<script>
function tryParse(v){ try{return JSON.parse(v);}catch(_){return null;} }
function scan(){
  const out = document.getElementById('out');
  out.innerHTML = '';
  const keys = [];
  for(let i=0;i<localStorage.length;i++) keys.push(localStorage.key(i));
  keys.sort();
  if(!keys.length){ out.innerHTML = '<p>Nessuna chiave trovata in localStorage su questa origine.</p>'; return; }

  let html = `<p><b>${keys.length}</b> chiavi totali trovate.</p>`;

  keys.forEach(k=>{
    const raw = localStorage.getItem(k);
    const parsed = tryParse(raw);
    let info = '';
    let size = raw ? raw.length : 0;

    if(Array.isArray(parsed)){
      info = `Array con <b>${parsed.length}</b> elementi`;
    } else if(parsed && typeof parsed === 'object'){
      const nKeys = Object.keys(parsed).length;
      info = `Oggetto con <b>${nKeys}</b> proprietà`;
    } else {
      info = `Valore semplice`;
    }

    html += `<div class="key">
      <b>${k}</b>
      <div class="meta">${info} — ${size} caratteri</div>
      <details><summary>Mostra contenuto grezzo (primi 2000 caratteri)</summary>
      <pre>${(raw||'').slice(0,2000).replace(/</g,'&lt;')}</pre></details>
    </div>`;
  });

  const lastSync = localStorage.getItem('ew_sb_last_sync');
  if(lastSync){
    html = `<div class="warn" style="background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.4)">
      Ultimo sync registrato: <b>${new Date(Number(lastSync)).toLocaleString('it-IT')}</b></div>` + html;
  }

  out.innerHTML = html;
}
scan();
</script>
</body>
</html>
