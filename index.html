<!DOCTYPE html>
<html lang="it">
<head>
<!-- AUTO-UPDATE: gira prima di tutto, svuota cache+SW se la build è cambiata -->
<script>
(function(){
  var BUILD='20260607-ew-v2';
  try{window.EW_BUILD=BUILD;}catch(e){}
  try{
    var qp=new URLSearchParams(location.search);
    if(qp.has('force_update')){
      history.replaceState({}, '', location.pathname);
      localStorage.removeItem('ew_build');
      if('caches' in window) caches.keys().then(function(k){k.forEach(function(c){caches.delete(c);});});
      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistrations().then(function(rs){
          Promise.all(rs.map(function(r){return r.unregister();})).then(function(){location.reload(true);});
        }).catch(function(){location.reload(true);});
      } else location.reload(true);
    }
  }catch(e){}
  var stored='';try{stored=localStorage.getItem('ew_build')||'';}catch(e){}
  if(stored!==BUILD){ try{localStorage.setItem('ew_build',BUILD);}catch(e){} }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E-Wallet">
<title>E-Wallet · TradClab</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c0a;
  --bg2:#0a1410;
  --gold:#c9a84c;
  --gold-bright:#e8c874;
  --green:#34d27a;
  --green-deep:#1f6b46;
  --text:#f3efe6;
  --muted:rgba(243,239,230,0.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  position:fixed;inset:0;
}

/* ════════ HUB ════════ */
#hub{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 28px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:
    radial-gradient(circle at 18% 8%, rgba(201,168,76,0.16) 0%, transparent 46%),
    radial-gradient(circle at 84% 92%, rgba(52,210,122,0.16) 0%, transparent 44%),
    linear-gradient(160deg,#0a1410 0%,#080c0a 60%,#0a0e0c 100%);
  transition:opacity .35s ease;
}
.hub-head{ text-align:center; margin:auto 0 2px; }
.hub-eyebrow{
  font-size:11px; letter-spacing:5px; text-transform:uppercase;
  color:var(--gold); opacity:.8; margin-bottom:10px;
}
.hub-title{
  font-family:'Bricolage Grotesque',sans-serif; font-weight:800;
  font-size:clamp(40px,11vw,64px); line-height:.92; letter-spacing:-.02em;
  margin:0; text-shadow:0 8px 40px rgba(0,0,0,.5);
}
.hub-title .e{ color:var(--gold-bright); }
.hub-title .w{ color:var(--green); }
.hub-tag{
  font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300;
  font-size:16px; color:var(--muted); margin-top:12px;
}

/* ════════ WALLET / CARTE ════════ */
.wallet{
  position:relative; width:min(340px,86vw); height:430px;
  margin:30px auto; perspective:1400px;
}
.card{
  position:absolute; left:0; right:0;
  height:212px; border-radius:22px;
  padding:22px 24px;
  cursor:pointer; color:#fff;
  display:flex; flex-direction:column; justify-content:space-between;
  box-shadow:0 26px 60px -18px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .55s cubic-bezier(.2,.8,.2,1), box-shadow .4s ease, opacity .4s ease;
  overflow:hidden; border:1px solid rgba(255,255,255,.14);
  will-change:transform;
}
.card::after{ /* riflesso obliquo */
  content:''; position:absolute; inset:0;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);
  opacity:.5; pointer-events:none;
}
.card .chip{
  width:42px; height:30px; border-radius:6px;
  background:linear-gradient(135deg,#f6e6b0,#caa84f 60%,#8c6f2c);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);
  position:relative;
}
.card .chip::before{
  content:''; position:absolute; inset:7px 9px;
  border:1px solid rgba(0,0,0,.25); border-radius:3px;
}
.card-row{ display:flex; align-items:flex-end; justify-content:space-between; }
.card-mono{
  font-family:'Bricolage Grotesque',sans-serif; font-weight:800;
  font-size:34px; letter-spacing:1px; line-height:1;
}
.card-name{ font-size:15px; font-weight:600; letter-spacing:.5px; }
.card-sub{ font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:.8; margin-top:3px; }
.card-open{
  font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
  opacity:.85; display:flex; align-items:center; gap:6px;
}

/* TradoCroods — oro */
#card-tc{
  background:linear-gradient(135deg,#4a3a14 0%,#8a6e26 40%,#c9a84c 100%);
}
#card-tc .card-mono{ color:#fff7e0; text-shadow:0 2px 10px rgba(0,0,0,.35); }
/* GoWork — verde */
#card-gw{
  background:linear-gradient(135deg,#0c2a1c 0%,#1f6b46 45%,#34d27a 100%);
}
#card-gw .card-mono{ color:#eafff3; text-shadow:0 2px 10px rgba(0,0,0,.35); }

/* stack: la carta "front" davanti e dritta, la "back" dietro, più piccola e inclinata */
.card.front{ transform:translateY(150px) scale(1) rotate(0deg); z-index:3; }
.card.back { transform:translateY(20px) scale(.9) rotate(-4deg); z-index:2; opacity:.92; }
.card.front:hover{ transform:translateY(144px) scale(1.015) rotate(0deg); }

/* switcher */
.switcher{
  display:inline-flex; gap:4px; margin:8px auto 0;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
  border-radius:40px; padding:4px; backdrop-filter:blur(8px);
}
.switcher button{
  border:0; cursor:pointer; font-family:'DM Sans',sans-serif;
  font-size:12px; font-weight:600; letter-spacing:.5px;
  padding:8px 18px; border-radius:30px; color:var(--muted);
  background:transparent; transition:all .25s ease;
}
.switcher button.active{ color:#10140f; }
.switcher button.active.tc{ background:linear-gradient(135deg,var(--gold-bright),var(--gold)); }
.switcher button.active.gw{ background:linear-gradient(135deg,#5ee29a,var(--green)); color:#06140c; }

.hub-foot{
  margin-top:auto; padding-top:18px;
  font-size:11px; letter-spacing:1.5px; color:rgba(201,168,76,.55);
  text-align:center;
}

/* ════════ PANEL APP (iframe) ════════ */
.app-panel{
  position:fixed; inset:0; z-index:40;
  background:var(--bg2);
  opacity:0; visibility:hidden;
  transform:translateY(100%);
  transition:transform .42s cubic-bezier(.3,.85,.25,1), opacity .3s ease, visibility .42s;
}
.app-panel.open{ opacity:1; visibility:visible; transform:translateY(0); }
.app-frame{
  position:absolute; inset:0; width:100%; height:100%;
  border:0; background:var(--bg2);
}

/* loader brandizzato (copre l'iframe finché non carica) */
.app-loader{
  position:absolute; inset:0; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  background:radial-gradient(circle at 50% 40%, #102018 0%, #0a1410 70%);
  transition:opacity .4s ease;
}
.app-loader.hide{ opacity:0; pointer-events:none; }
.loader-mono{
  font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:44px;
  letter-spacing:1px;
}
.loader-ring{
  width:34px; height:34px; border-radius:50%;
  border:2px solid rgba(255,255,255,.12); border-top-color:var(--gold);
  animation:spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.loader-label{ font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); }

/* back pill fluttuante */
.ew-back{
  position:fixed; z-index:60;
  top:calc(env(safe-area-inset-top) + 10px); left:12px;
  display:flex; align-items:center; gap:6px;
  padding:9px 16px 9px 12px; border-radius:30px; border:0; cursor:pointer;
  font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; letter-spacing:.3px;
  color:#10140f; background:rgba(243,239,230,.92);
  box-shadow:0 8px 24px -6px rgba(0,0,0,.6); backdrop-filter:blur(10px);
  opacity:0; transform:translateY(-12px) scale(.95); pointer-events:none;
  transition:all .35s cubic-bezier(.2,.8,.2,1);
}
.ew-back.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.ew-back:active{ transform:scale(.94); }
</style>
</head>
<body>

<!-- ════════ HUB ════════ -->
<div id="hub">
  <div class="hub-head">
    <div class="hub-eyebrow">Tradclab Wallet</div>
    <h1 class="hub-title"><span class="e">E</span>-Wall<span class="w">e</span>t</h1>
    <div class="hub-tag">Le tue app, un solo portafoglio.</div>
  </div>

  <div class="wallet" id="wallet">
    <!-- TradoCroods -->
    <div class="card front" id="card-tc" data-app="tc" onclick="cardTap('tc')">
      <div class="card-row">
        <div class="chip"></div>
        <div class="card-mono">TC</div>
      </div>
      <div class="card-row">
        <div>
          <div class="card-name">TradoCroods</div>
          <div class="card-sub">Budget · Famiglia</div>
        </div>
        <div class="card-open">Apri ›</div>
      </div>
    </div>
    <!-- GoWork -->
    <div class="card back" id="card-gw" data-app="gw" onclick="cardTap('gw')">
      <div class="card-row">
        <div class="chip"></div>
        <div class="card-mono">GW</div>
      </div>
      <div class="card-row">
        <div>
          <div class="card-name">GoWork</div>
          <div class="card-sub">Gestione · Orari</div>
        </div>
        <div class="card-open">Apri ›</div>
      </div>
    </div>
  </div>

  <div class="switcher" id="switcher">
    <button class="active tc" data-app="tc" onclick="bringFront('tc')">TradoCroods</button>
    <button class="gw" data-app="gw" onclick="bringFront('gw')">GoWork</button>
  </div>

  <div class="hub-foot">© 2026/2027 TRAD.CLAB · E-WALLET</div>
</div>

<!-- ════════ PANEL TRADOCROODS ════════ -->
<section class="app-panel" id="panel-tc">
  <div class="app-loader" id="loader-tc">
    <div class="loader-mono" style="color:var(--gold-bright)">TC</div>
    <div class="loader-ring"></div>
    <div class="loader-label">Apertura TradoCroods…</div>
  </div>
  <iframe class="app-frame" id="frame-tc" title="TradoCroods"
          allow="clipboard-read; clipboard-write; camera; geolocation"></iframe>
</section>

<!-- ════════ PANEL GOWORK ════════ -->
<section class="app-panel" id="panel-gw">
  <div class="app-loader" id="loader-gw">
    <div class="loader-mono" style="color:var(--green)">GW</div>
    <div class="loader-ring"></div>
    <div class="loader-label">Apertura GoWork…</div>
  </div>
  <iframe class="app-frame" id="frame-gw" title="GoWork"
          allow="clipboard-read; clipboard-write; camera; geolocation"></iframe>
</section>

<!-- back pill -->
<button class="ew-back" id="ewBack" onclick="closeApp()">‹ <span id="ewBackLabel">Wallet</span></button>

<script>
// ════════ CONFIG ════════
// Stessa origine (tradori23-ops.github.io) → iframe same-origin, localStorage condiviso.
const APPS = {
  tc: { url:'https://tradori23-ops.github.io/tradocroods/', label:'TradoCroods' },
  gw: { url:'https://tradori23-ops.github.io/GoWork/',      label:'GoWork' }
};
const EW_KEY = 'ew_user';     // identità condivisa (opzionale, per auto-login)
let frontApp = 'tc';          // carta in primo piano
let activeApp = null;         // app attualmente aperta
const loaded = { tc:false, gw:false };  // iframe già caricato?

// ════════ HUB: switch carta in primo piano ════════
function bringFront(which){
  frontApp = which;
  const tc = document.getElementById('card-tc');
  const gw = document.getElementById('card-gw');
  if(which==='tc'){ tc.className='card front'; gw.className='card back'; }
  else            { gw.className='card front'; tc.className='card back'; }
  document.querySelectorAll('#switcher button').forEach(b=>{
    b.classList.toggle('active', b.dataset.app===which);
  });
}

// tap su una carta: se è già davanti → apre; se è dietro → la porta davanti
function cardTap(which){
  if(which!==frontApp){ bringFront(which); return; }
  openApp(which);
}

// ════════ APRI APP (iframe lazy) ════════
function openApp(which){
  const cfg   = APPS[which];
  const panel = document.getElementById('panel-'+which);
  const frame = document.getElementById('frame-'+which);
  const loader= document.getElementById('loader-'+which);
  if(!cfg || !panel) return;

  activeApp = which;

  // mostra loader + panel; carica l'iframe solo la prima volta
  loader.classList.remove('hide');
  if(!loaded[which]){
    frame.onload = function(){
      loaded[which] = true;
      loader.classList.add('hide');
      tryAutoLogin(which, frame);
    };
    frame.src = cfg.url;
  } else {
    // già caricato: nascondi loader subito
    setTimeout(()=>loader.classList.add('hide'), 120);
  }

  // nascondi hub, mostra panel + back
  document.getElementById('hub').style.opacity = '0';
  panel.classList.add('open');
  const back = document.getElementById('ewBack');
  document.getElementById('ewBackLabel').textContent = 'Wallet';
  setTimeout(()=>back.classList.add('show'), 250);
}

// ════════ TORNA AL WALLET ════════
function closeApp(){
  const back = document.getElementById('ewBack');
  back.classList.remove('show');
  if(activeApp){
    const panel = document.getElementById('panel-'+activeApp);
    panel.classList.remove('open');   // l'iframe resta caricato per riaperture istantanee
  }
  document.getElementById('hub').style.opacity = '1';
  activeApp = null;
}

// ════════ AUTO-LOGIN best-effort (same-origin) ════════
// Le app hanno comunque il proprio login: questo è solo un tentativo
// non distruttivo di passare l'identità condivisa salvata in EW_KEY.
function tryAutoLogin(which, frame){
  try{
    const ewU = JSON.parse(localStorage.getItem(EW_KEY) || 'null');
    if(!ewU || !ewU.email) return;
    const win = frame.contentWindow;
    if(!win) return;
    if(which==='tc' && typeof win.selectProfile==='function'){
      win.selectProfile(ewU.email);
    }
    // GoWork: gancio lasciato pronto se in futuro esporrà una funzione dedicata
    // if(which==='gw' && typeof win.gwAutoLogin==='function'){ win.gwAutoLogin(ewU.email); }
  }catch(e){ /* cross-version / non disponibile: si ignora */ }
}

// ════════ PWA: manifest inline (deploy a file singolo) ════════
(function(){
  try{
    const mani = {
      name:'E-Wallet · TradClab', short_name:'E-Wallet',
      start_url:'./', display:'standalone',
      background_color:'#0a1410', theme_color:'#0a1410',
      icons:[]
    };
    const blob = new Blob([JSON.stringify(mani)], {type:'application/manifest+json'});
    const link = document.createElement('link');
    link.rel='manifest'; link.href=URL.createObjectURL(blob);
    document.head.appendChild(link);
  }catch(e){}
})();

// ESC per tornare al wallet (desktop)
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && activeApp) closeApp(); });
</script>
</body>
</html>
